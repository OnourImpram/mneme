[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mneme-code"
version = "0.2.0"
description = "Deterministic Python code-failure memory layer for mneme: redact-before-store, provenance-labelled FailureMemory, vault-ready markdown output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Onour Impram" }]
keywords = ["mneme", "code-failure", "traceback", "memory", "redaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mneme-core>=1.1.0",
    "mneme-graph>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4.7",
    "mypy>=1.10",
]

[project.scripts]
mneme-code = "mneme_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mneme_code"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["mneme_code"]

[[tool.mypy.overrides]]
module = ["mneme_graph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers --cov=mneme_code --cov-report=term-missing --cov-fail-under=80"
