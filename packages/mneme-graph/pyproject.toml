[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mneme-graph"
version = "0.2.0"
description = "Local code knowledge graph for mneme: tree-sitter extraction, atomic GraphStore, confidence-labelled nodes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Onour Impram" }]
keywords = ["mneme", "knowledge-graph", "tree-sitter", "code-graph", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mneme-core>=1.1.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4.7",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["mneme_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["mneme_graph"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_python.*", "tree_sitter_javascript.*", "tree_sitter_typescript.*"]
ignore_missing_imports = true

[project.scripts]
mneme-graph = "mneme_graph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers --cov=mneme_graph --cov-report=term-missing --cov-fail-under=80"
