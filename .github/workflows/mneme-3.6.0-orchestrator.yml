name: Mneme 3.6.0 release orchestrator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mneme-3-6-0-release-orchestrator
  cancel-in-progress: false

jobs:
  release:
    name: Verify, merge, tag, and publish Mneme 3.6.0
    if: github.head_ref == 'sol-ultra/mneme-ten-loop-upgrade-20260716'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require one-time release marker
        id: marker
        shell: bash
        run: |
          if [[ -f .github/mneme-3.6.0-orchestrate.ready ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v6
        if: steps.marker.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm

      - name: Prepare version and changelog
        if: steps.marker.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/version_bump.py 3.6.0
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if '## 3.6.0 - 2026-07-16' not in text and '## [3.6.0]' not in text:
              section = '''## 3.6.0 - 2026-07-16

### Changed

- Generated MCP client schemas from runtime Zod contracts and added nine-tool schema parity coverage.
- Required explicit `scope: "*"` caller intent for cross-scope retrieval and strengthened fail-closed graph isolation.
- Added tree-sitter ABI compatibility checks before native parser calls.
- Added bounded state readers and public input limits against unbounded resource consumption.
- Activated Python and Node coverage gates, artifact installation smoke tests, security contracts, and release invariants in CI.
- Reconciled retrieval, privacy, benchmark, architecture, and competitive claims with reachable behavior.
- Added machine-readable capability reporting and the ten-loop engineering evidence set.

### Compatibility

- Markdown vault and derived-index formats are unchanged.
- No data migration is required.
- Intentional cross-scope reads must pass `scope: "*"` explicitly.
- Inputs above documented safety limits are rejected before processing.

'''
              first_section = text.find('\n## ')
              if first_section == -1:
                  text = text.rstrip() + '\n\n' + section
              else:
                  insert_at = first_section + 1
                  text = text[:insert_at] + section + text[insert_at:]
              path.write_text(text, encoding='utf-8')
          PY
          python tools/version_bump.py --check 3.6.0

      - name: Run complete release-candidate gates
        if: steps.marker.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
          make install-dev
          make test
          make lint
          pnpm -r build
          make bench-all

      - name: Remove one-time automation and commit release preparation
        if: steps.marker.outputs.ready == 'true'
        id: prepared
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/mneme-3.6.0-orchestrate.ready
          rm -f .github/release-3.6.0.ready
          rm -f .github/workflows/mneme-3.6.0-orchestrator.yml
          rm -f .github/workflows/prepare-release-3.6.0.yml
          rm -f .github/workflows/release-on-version-merge.yml
          rm -f .github/engineering-bundle-diagnostic.json
          rm -f .github/ten-loop-engineering.ready
          rm -f .github/ten-loop-engineering.part-*
          rm -f .github/workflows/apply-engineering-bundle.yml
          git config user.name 'mneme release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release-preparation changes were produced.' >&2
            exit 1
          fi
          git commit -m 'release: prepare Mneme 3.6.0'
          prepared_sha=$(git rev-parse HEAD)
          echo "sha=$prepared_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Mark pull request ready and merge verified head
        if: steps.marker.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_SHA: ${{ steps.prepared.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr ready 30 --repo "$GITHUB_REPOSITORY" || true
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .head.sha)
          test "$current_head" = "$PREPARED_SHA"
          gh pr merge 30 \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --admin \
            --subject 'release: Mneme 3.6.0' \
            --body 'Ten-loop engineering hardening, contract correction, security and privacy improvements, retrieval truth reconciliation, portability fixes, package verification, and release-candidate evidence.'

      - name: Resolve merged commit and create annotated tag
        if: steps.marker.outputs.ready == 'true'
        id: merged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .merged)
            if [[ "$merged" == 'true' ]]; then
              break
            fi
            sleep 2
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .merged)" = 'true'
          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .merge_commit_sha)
          git fetch origin main --tags
          git checkout --detach "$merge_sha"
          python tools/version_bump.py --check 3.6.0
          if git ls-remote --exit-code --tags origin refs/tags/v3.6.0 >/dev/null 2>&1; then
            remote_tag_sha=$(git ls-remote origin refs/tags/v3.6.0 | awk '{print $1}')
            peeled_sha=$(git ls-remote origin refs/tags/v3.6.0^{} | awk '{print $1}')
            if [[ -n "$peeled_sha" ]]; then
              test "$peeled_sha" = "$merge_sha"
            else
              test "$remote_tag_sha" = "$merge_sha"
            fi
          else
            git tag -a v3.6.0 -m 'Mneme 3.6.0' "$merge_sha"
            git push origin refs/tags/v3.6.0
          fi
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted publishing workflow at v3.6.0
        if: steps.marker.outputs.ready == 'true'
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 20 --json databaseId --jq '.[].databaseId')
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref v3.6.0 \
            -f dry_run=false \
            -f target_version=3.6.0
          run_id=''
          for attempt in $(seq 1 60); do
            candidate=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch v3.6.0 \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,status,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [[ -n "$candidate" ]] && ! grep -qx "$candidate" <<< "$before"; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for trusted publishing result
        if: steps.marker.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
