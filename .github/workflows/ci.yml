name: CI

# CI runs the full Python and Node test matrices plus lint and type
# checks on every push and pull request to main, so tests and
# regression guards run on normal PRs and merges.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mneme-core editable
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: packages/mneme-core
        run: ruff check .
      - name: Type check with mypy strict
        working-directory: packages/mneme-core
        run: mypy --strict src/
      - name: Run pytest with coverage
        working-directory: packages/mneme-core
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.mneme-core
        run: pytest tests/ -v --cov=mneme_core --cov-config=pyproject.toml --cov-report=term-missing
      - name: Install mneme-cc-plugin editable
        working-directory: packages/mneme-cc-plugin
        run: pip install -e ".[dev]"
      - name: Lint mneme-cc-plugin with ruff
        working-directory: packages/mneme-cc-plugin
        run: ruff check .
      - name: Type check mneme-cc-plugin with mypy strict
        working-directory: packages/mneme-cc-plugin
        run: mypy --strict src/
      - name: Run mneme-cc-plugin pytest
        working-directory: packages/mneme-cc-plugin
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.mneme-cc-plugin
        run: pytest tests/ -v --cov=mneme_cc_plugin --cov-config=pyproject.toml --cov-branch --cov-report=term-missing
      - name: Install mneme-graph editable
        run: pip install -e "packages/mneme-graph[dev]"
      - name: Lint mneme-graph with ruff
        run: ruff check packages/mneme-graph
      - name: Type check mneme-graph with mypy strict
        run: mypy --strict packages/mneme-graph/mneme_graph
      - name: Run mneme-graph pytest with coverage
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.mneme-graph
        run: pytest packages/mneme-graph/tests -v --cov-config=packages/mneme-graph/pyproject.toml
      - name: Install mneme-code editable
        run: pip install -e "packages/mneme-code[dev]"
      - name: Lint mneme-code with ruff
        run: ruff check packages/mneme-code
      - name: Type check mneme-code with mypy strict
        run: mypy --strict packages/mneme-code/mneme_code
      - name: Run mneme-code pytest with coverage
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.mneme-code
        run: pytest packages/mneme-code/tests -v --cov-config=packages/mneme-code/pyproject.toml
      - name: Run cross-package parity tests
        run: pytest tests/parity -q

  node-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Run tests with 80 percent coverage gates
        run: pnpm --filter mneme-mcp-server test:coverage
      - name: Lint
        run: pnpm -r lint

  repo-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tool validator unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
      - name: Validate GitHub Actions workflows
        run: ./actionlint -color
      - name: Version sources agree
        run: python tools/version_bump.py --check
      - name: Critical-path hook verifier
        run: python tools/spec_verify.py
      - name: Claude plugin validator
        run: python tools/validate_claude_plugin.py packages/mneme-cc-plugin
      - name: Codex plugin validator
        run: python tools/validate_codex_plugin.py packages/mneme-codex-plugin
      - name: Antigravity plugin validator
        run: python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
      - name: Public repo integrity checks
        run: python tools/repo_integrity.py

  kg-neo4j-integration:
    name: KG integration (Neo4j)
    runs-on: ubuntu-latest
    # Exercises the full-profile KG connection contract against a real
    # Neo4j service container. Independent of the main matrices; the
    # gated test (tests/integration/test_kg_neo4j_integration.py) skips
    # everywhere this service is absent.
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      MNEME_NEO4J_TEST_URI: bolt://localhost:7687
      MNEME_NEO4J_TEST_USER: neo4j
      MNEME_NEO4J_TEST_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install mneme-core with dev tooling and the Neo4j driver
        working-directory: packages/mneme-core
        # The integration test only touches mneme_core.kg.client (stdlib
        # only) and the bolt driver, so the driver alone is sufficient and
        # avoids pulling the heavier graphiti-core from the [full] extra.
        run: |
          pip install -e ".[dev]"
          pip install "neo4j>=5.21,<6"
      - name: Run Neo4j integration test
        working-directory: packages/mneme-core
        run: pytest tests/integration/test_kg_neo4j_integration.py -v --no-cov

  benchmark-gate:
    name: Seven-surface benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install benchmark runtime
        working-directory: packages/mneme-core
        run: pip install -e '.[dev]'
      - name: Run deterministic release-candidate benchmarks
        run: >-
          python -m mneme_core.bench.gate all
          --output "${{ runner.temp }}/mneme-3.6-benchmark-gate.json"
      - uses: actions/upload-artifact@v7
        with:
          name: mneme-3.6-benchmark-gate
          path: ${{ runner.temp }}/mneme-3.6-benchmark-gate.json
