name: CI

# CI runs the full Python and Node test matrices plus lint and type
# checks on every push and pull request to main, so tests and
# regression guards run on normal PRs and merges.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mneme-core editable
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: packages/mneme-core
        run: ruff check .
      - name: Type check with mypy strict
        working-directory: packages/mneme-core
        run: mypy --strict src/
      - name: Run pytest with coverage
        working-directory: packages/mneme-core
        run: pytest tests/ -v --cov=mneme_core --cov-report=term-missing
      - name: Install mneme-cc-plugin editable
        working-directory: packages/mneme-cc-plugin
        run: pip install -e ".[dev]"
      - name: Lint mneme-cc-plugin with ruff
        working-directory: packages/mneme-cc-plugin
        run: ruff check .
      - name: Type check mneme-cc-plugin with mypy strict
        working-directory: packages/mneme-cc-plugin
        run: mypy --strict src/
      - name: Run mneme-cc-plugin pytest
        working-directory: packages/mneme-cc-plugin
        run: pytest tests/ -v --cov=mneme_cc_plugin --cov-branch --cov-report=term-missing
      - name: Install mneme-graph editable
        run: pip install -e "packages/mneme-graph[dev]"
      - name: Lint mneme-graph with ruff
        run: ruff check packages/mneme-graph
      - name: Type check mneme-graph with mypy strict
        run: mypy --strict packages/mneme-graph/mneme_graph
      - name: Run mneme-graph pytest with coverage
        run: pytest packages/mneme-graph/tests -v
      - name: Install mneme-code editable
        run: pip install -e "packages/mneme-code[dev]"
      - name: Lint mneme-code with ruff
        run: ruff check packages/mneme-code
      - name: Type check mneme-code with mypy strict
        run: mypy --strict packages/mneme-code/mneme_code
      - name: Run mneme-code pytest with coverage
        run: pytest packages/mneme-code/tests -v
      - name: Run cross-package parity tests
        run: pytest tests/parity -q

  node-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Run tests
        run: pnpm -r test
      - name: Lint
        run: pnpm -r lint

  repo-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Version sources agree
        run: python tools/version_bump.py --check
      - name: Critical-path hook verifier
        run: python tools/spec_verify.py
      - name: Codex plugin validator
        run: python tools/validate_codex_plugin.py packages/mneme-codex-plugin
      - name: Antigravity plugin validator
        run: python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
      - name: Public repo integrity checks
        run: python tools/repo_integrity.py

  kg-neo4j-integration:
    name: KG integration (Neo4j)
    runs-on: ubuntu-latest
    # Exercises the full-profile KG connection contract against a real
    # Neo4j service container. Independent of the main matrices; the
    # gated test (tests/integration/test_kg_neo4j_integration.py) skips
    # everywhere this service is absent.
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      MNEME_NEO4J_TEST_URI: bolt://localhost:7687
      MNEME_NEO4J_TEST_USER: neo4j
      MNEME_NEO4J_TEST_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install mneme-core with dev tooling and the Neo4j driver
        working-directory: packages/mneme-core
        # The integration test only touches mneme_core.kg.client (stdlib
        # only) and the bolt driver, so the driver alone is sufficient and
        # avoids pulling the heavier graphiti-core from the [full] extra.
        run: |
          pip install -e ".[dev]"
          pip install "neo4j>=5.21,<6"
      - name: Run Neo4j integration test
        working-directory: packages/mneme-core
        run: pytest tests/integration/test_kg_neo4j_integration.py -v --no-cov

  engineering-preflight:
    name: Ten-loop engineering preflight
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sol-ultra/mneme-ten-loop-upgrade')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Capture repository and environment baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engineering-preflight/logs
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "head_ref=${GITHUB_HEAD_REF:-}"
            echo "sha=$(git rev-parse HEAD)"
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "git=$(git --version)"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "pnpm=$(pnpm --version)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
          } > engineering-preflight/environment.txt
          git status --porcelain=v1 --untracked-files=all > engineering-preflight/worktree-before.txt
          git ls-files > engineering-preflight/tracked-files.txt
          git submodule status > engineering-preflight/submodules.txt 2>&1 || true
          sha256sum pnpm-lock.yaml > engineering-preflight/lockfile-sha256.txt 2>/dev/null || true
          find . -name 'pyproject.toml' -o -name 'package.json' -o -name '*lock*' | sort > engineering-preflight/dependency-manifests.txt
          git ls-files -z | tar --null --verbatim-files-from --files-from=- -czf engineering-preflight/mneme-source.tar.gz
      - name: Run complete baseline command surface
        shell: bash
        run: |
          set -euo pipefail
          summary=engineering-preflight/command-summary.tsv
          printf 'command\tstatus\tduration_seconds\n' > "$summary"
          run_check() {
            local name="$1"
            shift
            local started ended status
            started=$(date +%s)
            set +e
            bash -lc "$*" > "engineering-preflight/logs/${name}.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s)
            printf '%s\t%s\t%s\n' "$name" "$status" "$((ended-started))" >> "$summary"
          }
          run_check make-install-dev 'make install-dev'
          run_check make-test 'make test'
          run_check make-lint 'make lint'
          run_check version-check 'python tools/version_bump.py --check'
          run_check spec-verify 'python tools/spec_verify.py'
          run_check repo-integrity 'python tools/repo_integrity.py'
          run_check validate-codex 'python tools/validate_codex_plugin.py packages/mneme-codex-plugin'
          run_check validate-antigravity 'python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin'
          run_check pytest-core 'pytest packages/mneme-core/tests -q'
          run_check pytest-cc-plugin 'pytest packages/mneme-cc-plugin/tests -q'
          run_check pytest-graph 'pytest packages/mneme-graph/tests -q'
          run_check pytest-code 'pytest packages/mneme-code/tests -q'
          run_check pytest-parity 'pytest tests/parity -q'
          run_check pnpm-install 'pnpm install --frozen-lockfile'
          run_check pnpm-build 'pnpm -r build'
          run_check pnpm-test 'pnpm -r test'
          run_check pnpm-lint 'pnpm -r lint'
          run_check make-bench-all 'make bench-all'
          git status --porcelain=v1 --untracked-files=all > engineering-preflight/worktree-after.txt
          python -m pip freeze > engineering-preflight/pip-freeze.txt
          pnpm list -r --depth -1 > engineering-preflight/pnpm-workspace.txt 2>&1 || true
      - name: Upload engineering preflight artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mneme-ten-loop-preflight
          path: engineering-preflight/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce baseline failures after artifact upload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          rows = Path('engineering-preflight/command-summary.tsv').read_text(encoding='utf-8').splitlines()[1:]
          failed = [row for row in rows if row.split('\t')[1] != '0']
          if failed:
              raise SystemExit('Baseline failures:\n' + '\n'.join(failed))
          PY
