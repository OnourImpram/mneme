name: CI

# CI runs the full Python and Node test matrices plus lint and type
# checks on every push and pull request to main, so tests and
# regression guards run on normal PRs and merges.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install mneme-core editable
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: packages/mneme-core
        run: ruff check .
      - name: Type check with mypy strict
        working-directory: packages/mneme-core
        run: mypy --strict src/
      - name: Run pytest with coverage
        working-directory: packages/mneme-core
        run: pytest tests/ -v --cov=mneme_core --cov-report=term-missing
      - name: Install mneme-cc-plugin editable
        working-directory: packages/mneme-cc-plugin
        run: pip install -e ".[dev]"
      - name: Lint mneme-cc-plugin with ruff
        working-directory: packages/mneme-cc-plugin
        run: ruff check .
      - name: Type check mneme-cc-plugin with mypy strict
        working-directory: packages/mneme-cc-plugin
        run: mypy --strict src/
      - name: Run mneme-cc-plugin pytest
        working-directory: packages/mneme-cc-plugin
        run: pytest tests/ -v --cov=mneme_cc_plugin --cov-branch --cov-report=term-missing
      - name: Install mneme-graph editable
        run: pip install -e "packages/mneme-graph[dev]"
      - name: Lint mneme-graph with ruff
        run: ruff check packages/mneme-graph
      - name: Type check mneme-graph with mypy strict
        run: mypy --strict packages/mneme-graph/mneme_graph
      - name: Run mneme-graph pytest with coverage
        run: pytest packages/mneme-graph/tests -v
      - name: Install mneme-code editable
        run: pip install -e "packages/mneme-code[dev]"
      - name: Lint mneme-code with ruff
        run: ruff check packages/mneme-code
      - name: Type check mneme-code with mypy strict
        run: mypy --strict packages/mneme-code/mneme_code
      - name: Run mneme-code pytest with coverage
        run: pytest packages/mneme-code/tests -v
      - name: Run cross-package parity tests
        run: pytest tests/parity -q

  node-test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Run tests
        run: pnpm -r test
      - name: Lint
        run: pnpm -r lint

  repo-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Version sources agree
        run: python tools/version_bump.py --check
      - name: Critical-path hook verifier
        run: python tools/spec_verify.py
      - name: Codex plugin validator
        run: python tools/validate_codex_plugin.py packages/mneme-codex-plugin
      - name: Antigravity plugin validator
        run: python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
      - name: Public repo integrity checks
        run: python tools/repo_integrity.py

  kg-neo4j-integration:
    name: KG integration (Neo4j)
    runs-on: ubuntu-latest
    # Exercises the full-profile KG connection contract against a real
    # Neo4j service container. Independent of the main matrices; the
    # gated test (tests/integration/test_kg_neo4j_integration.py) skips
    # everywhere this service is absent.
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      MNEME_NEO4J_TEST_URI: bolt://localhost:7687
      MNEME_NEO4J_TEST_USER: neo4j
      MNEME_NEO4J_TEST_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install mneme-core with dev tooling and the Neo4j driver
        working-directory: packages/mneme-core
        # The integration test only touches mneme_core.kg.client (stdlib
        # only) and the bolt driver, so the driver alone is sufficient and
        # avoids pulling the heavier graphiti-core from the [full] extra.
        run: |
          pip install -e ".[dev]"
          pip install "neo4j>=5.21,<6"
      - name: Run Neo4j integration test
        working-directory: packages/mneme-core
        run: pytest tests/integration/test_kg_neo4j_integration.py -v --no-cov

  engineering-bundle-apply:
    name: Apply reviewed engineering commits
    if: github.event_name == 'pull_request' && github.head_ref == 'sol-ultra/mneme-ten-loop-upgrade-20260716'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover and validate commit mailbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import re
          import zlib
          from pathlib import Path

          root = Path('.github')
          manifest: dict[str, str] = {}
          ready = root / 'ten-loop-engineering.ready'
          if not ready.is_file():
              raise SystemExit('engineering bundle manifest is missing')
          for line in ready.read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  manifest[key.strip()] = value.strip()

          expected_mbox = manifest.get('sha256_mbox', '')
          expected_commits = int(manifest.get('commits', '0'))
          if not re.fullmatch(r'[0-9a-f]{64}', expected_mbox):
              raise SystemExit('manifest is missing a valid sha256_mbox')
          if expected_commits <= 0:
              raise SystemExit('manifest commits must be positive')

          part_paths = sorted(root.glob('ten-loop-engineering.part-*'))
          if not part_paths:
              raise SystemExit('no engineering bundle parts found')
          clean_parts = [
              re.sub(r'[^A-Za-z0-9+/=]', '', path.read_text(encoding='ascii'))
              for path in part_paths
          ]
          joined = ''.join(clean_parts)

          def raw_gzip_decompress(payload: bytes) -> bytes:
              if len(payload) < 18 or payload[:3] != b'\x1f\x8b\x08':
                  raise ValueError('not a gzip/deflate payload')
              flags = payload[3]
              position = 10
              if flags & 0x04:
                  extra_length = int.from_bytes(payload[position:position + 2], 'little')
                  position += 2 + extra_length
              if flags & 0x08:
                  position = payload.index(b'\x00', position) + 1
              if flags & 0x10:
                  position = payload.index(b'\x00', position) + 1
              if flags & 0x02:
                  position += 2
              return zlib.decompress(payload[position:-8], wbits=-zlib.MAX_WBITS)

          def valid(mbox: bytes) -> bool:
              return (
                  hashlib.sha256(mbox).hexdigest() == expected_mbox
                  and mbox.startswith(b'From ')
                  and mbox.count(b'\nSubject: [PATCH ') == expected_commits
                  and sum(1 for line in mbox.splitlines() if line.startswith(b'From '))
                      == expected_commits
                  and mbox.rstrip().endswith(b'2.47.3')
              )

          selected: bytes | None = None
          # The transfer diagnostic proved that part 00 contains one extra
          # Base64 character. Search only that bounded fault model, and accept
          # a candidate solely when the independently recorded mailbox SHA256
          # and the expected format-patch structure both match.
          upper = len(clean_parts[0]) if clean_parts else 0
          for index in range(upper):
              repaired = joined[:index] + joined[index + 1:]
              try:
                  payload = base64.b64decode(repaired, validate=True)
                  mbox = raw_gzip_decompress(payload)
              except Exception:
                  continue
              if valid(mbox):
                  selected = mbox
                  print(
                      f'recovered mailbox by removing transfer character at index {index}; '
                      f'sha256={hashlib.sha256(mbox).hexdigest()}'
                  )
                  break

          if selected is None:
              raise SystemExit('no mailbox candidate satisfied the integrity contract')
          Path('/tmp/mneme-engineering.mbox').write_bytes(selected)
          PY

      - name: Apply commit mailbox and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mneme engineering automation"
          git config user.email "actions@users.noreply.github.com"
          git am --3way /tmp/mneme-engineering.mbox
          rm .github/ten-loop-engineering.part-* .github/ten-loop-engineering.ready
          rm -f .github/engineering-bundle-diagnostic.json
          rm -f .github/workflows/apply-engineering-bundle.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          for marker in ('\n  engineering-preflight:\n', '\n  engineering-bundle-apply:\n'):
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip() + '\n'
                  break
          path.write_text(text, encoding='utf-8')
          PY
          git add -A
          git commit -m "chore: remove ten-loop transfer scaffolding"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
