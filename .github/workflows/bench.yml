name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/mneme-core/**'
      - 'packages/mneme-mcp/**'
      - 'benchmarks/**'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mneme-core/**'
      - 'packages/mneme-mcp/**'
      - 'benchmarks/**'
      - '.github/workflows/bench.yml'

jobs:
  retrieval-quality:
    name: Benchmark A - Retrieval Quality (nDCG@5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mneme-core
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Pin SQLite for reproducible BM25 (pysqlite3)
        # FTS5 BM25 ranking shifts across SQLite versions, so the runner's
        # bundled SQLite would otherwise drift the locked nDCG baseline. This
        # wheel bundles a fixed SQLite (3.51.1); run.py routes sqlite3 through
        # it. Linux-only, which matches this ubuntu-only job. Use `python -m
        # pip` and verify the import with the same interpreter the benchmark
        # runs, so a wrong-interpreter install fails loudly here instead of
        # silently falling back to the stdlib SQLite downstream.
        run: |
          python -m pip install "pysqlite3-binary==0.5.4.post2"
          python -c "import pysqlite3; print('pysqlite3 OK, SQLite', pysqlite3.sqlite_version)"
      - name: Run retrieval benchmark
        run: |
          mkdir -p benchmarks/_runs
          python benchmarks/retrieval/run.py --output-format=json \
            --hardware-output benchmarks/_runs/retrieval-hardware.json \
            --output benchmarks/_runs/retrieval.json
      - name: Regression guard (nDCG@5, Recall@10, negative probe)
        run: python benchmarks/retrieval/regression_guard.py benchmarks/_runs/retrieval.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-retrieval
          path: benchmarks/_runs/retrieval*.json

  latency:
    name: Benchmark B - Latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mneme-core
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Run latency benchmark
        run: |
          mkdir -p benchmarks/_runs
          python benchmarks/latency/run.py --output-format=json --sessions=100 \
            --hardware-output benchmarks/_runs/latency-hardware.json \
            --output benchmarks/_runs/latency.json
      - name: P95 guard (Stop hook proxy must stay under 1000ms)
        run: python benchmarks/latency/p95_guard.py benchmarks/_runs/latency.json --threshold-ms=1000
      - uses: actions/upload-artifact@v4
        with:
          name: bench-latency
          path: benchmarks/_runs/latency*.json

  cost:
    name: Benchmark C - Adaptive Context Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mneme-core
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Run cost benchmark
        run: |
          mkdir -p benchmarks/_runs
          python benchmarks/cost/run.py --output-format=json \
            --hardware-output benchmarks/_runs/cost-hardware.json \
            --output benchmarks/_runs/cost.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-cost
          path: benchmarks/_runs/cost*.json

  migration:
    name: Benchmark D - Migration Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install mneme-core
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run migration benchmark
        run: |
          mkdir -p benchmarks/_runs
          python benchmarks/migration/run.py --output-format=json --observations=200 \
            --hardware-output benchmarks/_runs/migration-hardware.json \
            --output benchmarks/_runs/migration.json
      - name: Assert all migration assertions passed
        run: |
          python - <<'PY'
          import json, sys
          payload = json.loads(open("benchmarks/_runs/migration.json", encoding="utf-8").read())
          status = payload.get("status")
          if status == "skipped":
              print("Migration benchmark skipped:", payload.get("reason"))
              sys.exit(0)
          if status != "ok":
              print("Migration benchmark error:", payload)
              sys.exit(1)
          for key, value in payload.get("assertions", {}).items():
              if not value:
                  print(f"Assertion failed: {key}")
                  sys.exit(1)
          print("All migration assertions passed.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bench-migration
          path: benchmarks/_runs/migration*.json

  head-to-head:
    name: Benchmark E - Head-to-Head (mneme adapter only in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install mneme-core
        working-directory: packages/mneme-core
        run: pip install -e ".[dev]"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run head-to-head benchmark
        run: |
          mkdir -p benchmarks/_runs
          python benchmarks/head-to-head/run.py --output-format=json \
            --hardware-output benchmarks/_runs/head-to-head-hardware.json \
            --output benchmarks/_runs/head-to-head.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-head-to-head
          path: benchmarks/_runs/head-to-head*.json
