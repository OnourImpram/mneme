name: Publish npm (manual)

# Manual, npm-only publish for packages/mneme-mcp (published as `mneme-mcp-server`).
# Separate from release.yml so the npm package can be (re)published without
# re-running the PyPI jobs, which reject re-uploading an already-published
# version. Uses the same `npm` environment + NPM_TOKEN as release.yml.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual npm publish is being run'
        required: false
        default: ''

jobs:
  publish-npm:
    name: Publish mneme-mcp-server to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm -r build
      - name: Publish to npm
        working-directory: packages/mneme-mcp
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
