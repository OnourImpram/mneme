name: Apply engineering bundle

on:
  push:
    branches: [sol-ultra/mneme-ten-loop-upgrade-20260716]
    paths:
      - '.github/ten-loop-engineering.ready'

permissions:
  contents: write

concurrency:
  group: mneme-engineering-bundle
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed local commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode and validate commit bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.github')
          diagnostic_path = root / 'engineering-bundle-diagnostic.json'
          manifest_path = root / 'ten-loop-engineering.ready'
          manifest = {}
          for line in manifest_path.read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  manifest[key.strip()] = value.strip()

          expected = manifest.get('sha256_gzip')
          expected_base64 = manifest.get('sha256_base64')
          if not expected or not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('ready manifest is missing a valid sha256_gzip')

          part_paths = sorted(root.glob('ten-loop-engineering.part-*'))
          if not part_paths:
              raise SystemExit('no engineering bundle parts found')

          alphabet = re.compile(r'[^A-Za-z0-9+/=]')
          texts = [path.read_text(encoding='ascii') for path in part_paths]

          diagnostic: dict[str, object] = {
              'expected_sha256_gzip': expected,
              'expected_sha256_base64': expected_base64,
              'manifest': manifest,
              'parts': [
                  {
                      'path': str(path),
                      'chars': len(text),
                      'clean_chars': len(alphabet.sub('', text)),
                      'sha256_text': hashlib.sha256(text.encode('ascii')).hexdigest(),
                      'prefix': text[:12],
                      'suffix': text[-12:],
                  }
                  for path, text in zip(part_paths, texts, strict=True)
              ],
              'candidates': [],
              'errors': [],
          }

          def clean(value: str) -> str:
              return alphabet.sub('', value)

          candidates: list[tuple[str, bytes]] = []
          clean_parts = [clean(text) for text in texts]
          joined = ''.join(clean_parts)

          try:
              candidates.append(('joined', base64.b64decode(joined, validate=True)))
          except Exception as exc:
              diagnostic['errors'].append({'candidate': 'joined', 'error': str(exc)})

          try:
              chunks = [base64.b64decode(text, validate=True) for text in clean_parts]
              candidates.append(('per-part', b''.join(chunks)))
          except Exception as exc:
              diagnostic['errors'].append({'candidate': 'per-part', 'error': str(exc)})

          try:
              depadded = ''.join(text.rstrip('=') for text in clean_parts)
              depadded += '=' * (-len(depadded) % 4)
              candidates.append(
                  ('interior-padding-normalized', base64.b64decode(depadded, validate=True))
              )
          except Exception as exc:
              diagnostic['errors'].append(
                  {'candidate': 'interior-padding-normalized', 'error': str(exc)}
              )

          # The first part is one character longer than every intended 9000
          # character transport chunk. Recover only a single-character deletion
          # whose decoded bytes exactly match the pre-recorded gzip SHA256.
          # This uses the payload digest as the authority and never applies a
          # merely decodable or heuristic candidate.
          if clean_parts and len(clean_parts[0]) == 9001 and len(joined) % 4 == 1:
              prefix_length = 0
              repaired: tuple[int, str, bytes] | None = None
              for local_index in range(len(clean_parts[0])):
                  global_index = prefix_length + local_index
                  candidate_text = joined[:global_index] + joined[global_index + 1 :]
                  try:
                      payload = base64.b64decode(candidate_text, validate=True)
                  except Exception:
                      continue
                  if hashlib.sha256(payload).hexdigest() == expected:
                      repaired = (global_index, joined[global_index], payload)
                      break
              if repaired is not None:
                  repaired_index, removed_character, repaired_payload = repaired
                  diagnostic['repair'] = {
                      'kind': 'single-character-removal',
                      'index': repaired_index,
                      'removed_character': removed_character,
                      'authority': 'sha256_gzip',
                  }
                  candidates.append(
                      (f'single-character-repair@{repaired_index}', repaired_payload)
                  )
              else:
                  diagnostic['errors'].append(
                      {
                          'candidate': 'single-character-repair',
                          'error': 'no one-character deletion matched sha256_gzip',
                      }
                  )

          selected: tuple[str, bytes] | None = None
          for name, payload in candidates:
              digest = hashlib.sha256(payload).hexdigest()
              diagnostic['candidates'].append(
                  {'name': name, 'bytes': len(payload), 'sha256': digest}
              )
              if digest == expected and selected is None:
                  selected = (name, payload)

          diagnostic_path.write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          if selected is None:
              raise SystemExit(
                  'no decoded candidate matched the manifest sha256_gzip, refusing to apply'
              )

          name, compressed = selected
          mbox = gzip.decompress(compressed)
          if b'From ' not in mbox[:256]:
              raise SystemExit('decoded payload is not a git format-patch mailbox')

          Path('/tmp/mneme-engineering.mbox.gz').write_bytes(compressed)
          Path('/tmp/mneme-engineering.mbox').write_bytes(mbox)
          print(
              f'selected={name} compressed_bytes={len(compressed)} '
              f'mbox_bytes={len(mbox)} mbox_sha256={hashlib.sha256(mbox).hexdigest()}'
          )
          PY

      - name: Persist diagnostic when decoding fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/engineering-bundle-diagnostic.json ]]; then
            git config user.name "mneme engineering automation"
            git config user.email "actions@users.noreply.github.com"
            git add .github/engineering-bundle-diagnostic.json
            git commit -m "chore: record engineering bundle decode diagnostic"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Apply commit bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mneme engineering automation"
          git config user.email "actions@users.noreply.github.com"
          git am --3way /tmp/mneme-engineering.mbox

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify applied changes
        shell: bash
        run: |
          set -euo pipefail
          make install-dev
          make test
          make lint
          python tools/version_bump.py --check
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin

      - name: Remove one-time transfer files and publish commits
        shell: bash
        run: |
          set -euo pipefail
          rm .github/ten-loop-engineering.part-* .github/ten-loop-engineering.ready
          rm -f .github/engineering-bundle-diagnostic.json
          rm .github/workflows/apply-engineering-bundle.yml
          git add -A
          git commit -m "chore: remove one-time engineering transfer files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
