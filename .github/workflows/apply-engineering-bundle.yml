name: Apply engineering bundle

on:
  push:
    branches: [sol-ultra/mneme-ten-loop-upgrade-20260716]
    paths:
      - '.github/ten-loop-engineering.ready'

permissions:
  contents: write

concurrency:
  group: mneme-engineering-bundle
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed local commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Recover and validate commit mailbox
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import re
          import zlib
          from pathlib import Path

          root = Path('.github')
          manifest = {}
          for line in (root / 'ten-loop-engineering.ready').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  manifest[key.strip()] = value.strip()

          expected_gzip = manifest.get('sha256_gzip', '')
          expected_mbox = manifest.get('sha256_mbox', '')
          expected_commits = int(manifest.get('commits', '0'))
          for label, value in (
              ('sha256_gzip', expected_gzip),
              ('sha256_mbox', expected_mbox),
          ):
              if not re.fullmatch(r'[0-9a-f]{64}', value):
                  raise SystemExit(f'manifest is missing a valid {label}')
          if expected_commits <= 0:
              raise SystemExit('manifest commits must be positive')

          part_paths = sorted(root.glob('ten-loop-engineering.part-*'))
          if not part_paths:
              raise SystemExit('no engineering bundle parts found')
          clean_parts = [
              re.sub(r'[^A-Za-z0-9+/=]', '', path.read_text(encoding='ascii'))
              for path in part_paths
          ]
          joined = ''.join(clean_parts)

          diagnostic: dict[str, object] = {
              'manifest': manifest,
              'parts': [
                  {'path': str(path), 'characters': len(text)}
                  for path, text in zip(part_paths, clean_parts, strict=True)
              ],
              'attempts': [],
          }

          def validate_mbox(mbox: bytes) -> bool:
              digest = hashlib.sha256(mbox).hexdigest()
              subjects = mbox.count(b'\nSubject: [PATCH ')
              separators = mbox.count(b'\nFrom ')
              complete_tail = mbox.rstrip().endswith(b'2.47.3')
              diagnostic['attempts'].append(
                  {
                      'kind': 'mailbox-validation',
                      'bytes': len(mbox),
                      'sha256': digest,
                      'subjects': subjects,
                      'message_separators': separators,
                      'complete_tail': complete_tail,
                  }
              )
              return (
                  digest == expected_mbox
                  and subjects == expected_commits
                  and separators == expected_commits - 1
                  and complete_tail
                  and mbox.startswith(b'From ')
              )

          def raw_gzip_decompress(payload: bytes) -> bytes:
              if len(payload) < 18 or payload[:3] != b'\x1f\x8b\x08':
                  raise ValueError('not a gzip/deflate payload')
              flags = payload[3]
              position = 10
              if flags & 0x04:
                  extra_length = int.from_bytes(payload[position:position + 2], 'little')
                  position += 2 + extra_length
              if flags & 0x08:
                  position = payload.index(b'\x00', position) + 1
              if flags & 0x10:
                  position = payload.index(b'\x00', position) + 1
              if flags & 0x02:
                  position += 2
              if position >= len(payload) - 8:
                  raise ValueError('invalid gzip framing')
              return zlib.decompress(payload[position:-8], wbits=-zlib.MAX_WBITS)

          selected_mbox: bytes | None = None
          selected_kind: str | None = None

          # Preferred path. Accept only the original compressed payload digest.
          try:
              payload = base64.b64decode(joined, validate=True)
              diagnostic['attempts'].append(
                  {
                      'kind': 'original-compressed',
                      'bytes': len(payload),
                      'sha256': hashlib.sha256(payload).hexdigest(),
                  }
              )
              if hashlib.sha256(payload).hexdigest() == expected_gzip:
                  mbox = gzip.decompress(payload)
                  if validate_mbox(mbox):
                      selected_mbox = mbox
                      selected_kind = 'original-compressed'
          except Exception as exc:
              diagnostic['attempts'].append(
                  {'kind': 'original-compressed-error', 'error': str(exc)}
              )

          # The transfer diagnostic established one extra Base64 character in
          # part 00 and a damaged gzip trailer. Search only single-character
          # deletion candidates inside that anomalous part. Ignore the trailer
          # by decoding the raw DEFLATE member, then require the independently
          # recorded mailbox SHA256 and complete two-message format-patch shape.
          if selected_mbox is None and clean_parts and len(clean_parts[0]) == 9001:
              for index in range(len(clean_parts[0])):
                  repaired_text = joined[:index] + joined[index + 1:]
                  try:
                      payload = base64.b64decode(repaired_text, validate=True)
                      mbox = raw_gzip_decompress(payload)
                  except Exception:
                      continue
                  if validate_mbox(mbox):
                      selected_mbox = mbox
                      selected_kind = f'recovered-single-character@{index}'
                      diagnostic['repair'] = {
                          'index': index,
                          'removed_character': joined[index],
                          'compressed_sha256': hashlib.sha256(payload).hexdigest(),
                          'mailbox_sha256': hashlib.sha256(mbox).hexdigest(),
                          'gzip_trailer_ignored': True,
                      }
                      break

          (root / 'engineering-bundle-diagnostic.json').write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          if selected_mbox is None or selected_kind is None:
              raise SystemExit('no mailbox candidate satisfied the recorded integrity contract')

          Path('/tmp/mneme-engineering.mbox').write_bytes(selected_mbox)
          print(
              f'selected={selected_kind} bytes={len(selected_mbox)} '
              f'sha256={hashlib.sha256(selected_mbox).hexdigest()}'
          )
          PY

      - name: Persist diagnostic when recovery fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/engineering-bundle-diagnostic.json ]]; then
            git config user.name "mneme engineering automation"
            git config user.email "actions@users.noreply.github.com"
            git add .github/engineering-bundle-diagnostic.json
            git commit -m "chore: record engineering bundle recovery diagnostic"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Apply commit mailbox
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mneme engineering automation"
          git config user.email "actions@users.noreply.github.com"
          git am --3way /tmp/mneme-engineering.mbox

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify applied changes
        shell: bash
        run: |
          set -euo pipefail
          make install-dev
          make test
          make lint
          python tools/version_bump.py --check
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin

      - name: Remove one-time transfer files and publish commits
        shell: bash
        run: |
          set -euo pipefail
          rm .github/ten-loop-engineering.part-* .github/ten-loop-engineering.ready
          rm -f .github/engineering-bundle-diagnostic.json
          rm .github/workflows/apply-engineering-bundle.yml
          git add -A
          git commit -m "chore: remove one-time engineering transfer files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
