name: Finalize Mneme 3.6.0 v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mneme-finalize-3-6-0
  cancel-in-progress: true

jobs:
  finalize:
    name: Reconcile, verify, merge, tag, and publish
    if: github.head_ref == 'release/mneme-3.6.0-finalize-20260716'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Require v2 finalization marker
        id: marker
        shell: bash
        run: |
          if [[ -f .github/finalize-mneme-3.6.0-v2.ready ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
        if: steps.marker.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm

      - name: Detect an already complete public release
        if: steps.marker.outputs.ready == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          complete=false
          if gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && python tools/version_bump.py --check 3.6.0 >/dev/null 2>&1; then
            if python - <<'PY'
          import json
          import urllib.request
          endpoints = [
              'https://pypi.org/pypi/mneme-core/3.6.0/json',
              'https://pypi.org/pypi/mneme-cc-plugin/3.6.0/json',
              'https://pypi.org/pypi/mneme-graph/3.6.0/json',
              'https://pypi.org/pypi/mneme-code/3.6.0/json',
              'https://registry.npmjs.org/mneme-mcp-server/3.6.0',
          ]
          for url in endpoints:
              with urllib.request.urlopen(url, timeout=20) as response:
                  if not json.load(response):
                      raise SystemExit(1)
          PY
            then
              complete=true
            fi
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Close without changes when 3.6.0 is already public
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'Mneme 3.6.0 is already fully public. GitHub Release, all four PyPI distributions, and the npm package were independently observed. This finalization PR is closed without repository changes.'
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch

      - name: Reconcile PR 30 source if it is still unmerged
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .merged 2>/dev/null || echo false)" != 'true' ]]; then
            source_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .head.ref)
            git fetch origin "$source_ref"
            git merge --squash --no-commit "origin/$source_ref"
          fi

      - name: Prepare the clean 3.6.0 candidate
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/version_bump.py 3.6.0
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## 3.6.0 - 2026-07-16' not in text and '## [3.6.0]' not in text:
              section = '''## 3.6.0 - 2026-07-16

### Changed

- Generated MCP client schemas from runtime Zod contracts and added nine-tool schema parity coverage.
- Required explicit `scope: "*"` caller intent for cross-scope retrieval and strengthened fail-closed graph isolation.
- Added tree-sitter ABI compatibility checks before native parser calls.
- Added bounded state readers and public input limits against unbounded resource consumption.
- Activated Python and Node coverage gates, artifact installation smoke tests, security contracts, and release invariants in CI.
- Reconciled retrieval, privacy, benchmark, architecture, and competitive claims with reachable behavior.
- Added machine-readable capability reporting and the ten-loop engineering evidence set.

### Compatibility

- Markdown vault and derived-index formats are unchanged.
- No data migration is required.
- Intentional cross-scope reads must pass `scope: "*"` explicitly.
- Inputs above documented safety limits are rejected before processing.

'''
              first_section = text.find('\n## ')
              if first_section == -1:
                  text = text.rstrip() + '\n\n' + section
              else:
                  text = text[:first_section + 1] + section + text[first_section + 1:]
              changelog.write_text(text, encoding='utf-8')

          release_notes = Path('docs/releases/3.6.0.md')
          release_notes.parent.mkdir(parents=True, exist_ok=True)
          if not release_notes.exists():
              release_notes.write_text('''# Mneme 3.6.0

Mneme 3.6.0 is a reliability, security, privacy, retrieval-contract, and release-engineering upgrade produced through ten complete engineering loops.

Markdown remains durable ground truth. Derived indexes remain rebuildable. The Stop path remains deterministic, local, and free of LLM or external-network dependencies.

See `docs/MNEME_TEN_LOOP_ENGINEERING_REPORT.md` for the complete evidence record.
''', encoding='utf-8')
          PY
          rm -f .github/finalize-mneme-3.6.0.ready
          rm -f .github/finalize-mneme-3.6.0-v2.ready
          rm -f .github/workflows/finalize-mneme-3.6.0.yml
          rm -f .github/workflows/finalize-mneme-3.6.0-v2.yml
          rm -f .github/mneme-3.6.0-orchestrate.ready
          rm -f .github/release-3.6.0.ready
          rm -f .github/post-merge-publish-3.6.0.ready
          rm -f .github/confirm-publication-3.6.0.ready
          rm -f .github/workflows/mneme-3.6.0-orchestrator.yml
          rm -f .github/workflows/prepare-release-3.6.0.yml
          rm -f .github/workflows/release-on-version-merge.yml
          rm -f .github/workflows/post-merge-publish-3.6.0.yml
          rm -f .github/workflows/confirm-publication-3.6.0.yml
          rm -f .github/engineering-bundle-diagnostic.json
          rm -f .github/ten-loop-engineering.ready
          rm -f .github/ten-loop-engineering.part-*
          rm -f .github/workflows/apply-engineering-bundle.yml
          python tools/version_bump.py --check 3.6.0

      - name: Run complete release-candidate gates
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
          make install-dev
          make test
          make lint
          pnpm -r build
          make bench-all

      - name: Commit and push the clean candidate when needed
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mneme release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'release: prepare Mneme 3.6.0'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Merge candidate or close an empty finalizer
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: merged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == 'true' ]]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$CANDIDATE_SHA"
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
            gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --admin \
              --subject 'release: Mneme 3.6.0' \
              --body 'Verified ten-loop engineering hardening and release preparation.'
            for attempt in $(seq 1 30); do
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)" == 'true' ]] && break
              sleep 2
            done
            release_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merge_commit_sha)
          else
            git fetch origin main
            release_sha=$(git rev-parse origin/main)
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch || true
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve or create immutable v3.6.0 tag
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: tag
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.merged.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git ls-remote --exit-code --tags origin refs/tags/v3.6.0 >/dev/null 2>&1; then
            git fetch origin tag v3.6.0
            tagged_sha=$(git rev-list -n 1 v3.6.0)
            git checkout --detach "$tagged_sha"
            python tools/version_bump.py --check 3.6.0
            echo "sha=$tagged_sha" >> "$GITHUB_OUTPUT"
          else
            git checkout --detach "$RELEASE_SHA"
            python tools/version_bump.py --check 3.6.0
            git config user.name 'mneme release automation'
            git config user.email 'actions@users.noreply.github.com'
            git tag -a v3.6.0 -m 'Mneme 3.6.0' "$RELEASE_SHA"
            git push origin refs/tags/v3.6.0
            echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse or dispatch trusted publishing
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 \
            --json databaseId,headSha,conclusion,status,createdAt \
            --jq "map(select(.headSha == \"$TAG_SHA\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")
          if [[ -z "$run_id" ]]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v3.6.0 \
              -f dry_run=false -f target_version=3.6.0
            for attempt in $(seq 1 60); do
              run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 \
                --json databaseId,headSha,createdAt \
                --jq "map(select(.headSha == \"$TAG_SHA\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")
              [[ -n "$run_id" ]] && break
              sleep 2
            done
          fi
          test -n "$run_id"
          if [[ "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" != 'completed' ]]; then
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          fi
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = 'success'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify public publication and record evidence
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.publishing.outputs.run_id }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          release_url=$(gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url \
            --jq 'select(.tagName == "v3.6.0" and .isDraft == false and .isPrerelease == false) | .url')
          test -n "$release_url"
          python - <<'PY'
          import json
          import time
          import urllib.request
          endpoints = {
              'mneme-core': 'https://pypi.org/pypi/mneme-core/3.6.0/json',
              'mneme-cc-plugin': 'https://pypi.org/pypi/mneme-cc-plugin/3.6.0/json',
              'mneme-graph': 'https://pypi.org/pypi/mneme-graph/3.6.0/json',
              'mneme-code': 'https://pypi.org/pypi/mneme-code/3.6.0/json',
              'mneme-mcp-server': 'https://registry.npmjs.org/mneme-mcp-server/3.6.0',
          }
          pending = dict(endpoints)
          for _ in range(80):
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=15) as response:
                          if json.load(response):
                              del pending[name]
                  except Exception:
                      pass
              if not pending:
                  break
              time.sleep(15)
          if pending:
              raise SystemExit('Registry versions not observable: ' + ', '.join(sorted(pending)))
          PY
          marker='<!-- mneme-3.6.0-release-verification -->'
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/30/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          body=$(cat <<EOF
          $marker
          ## Mneme 3.6.0 publication verified

          - Annotated tag: \`v3.6.0\`
          - Tagged commit: \`$TAG_SHA\`
          - GitHub Release: $release_url
          - Trusted publishing workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - PyPI: \`mneme-core==3.6.0\`, \`mneme-cc-plugin==3.6.0\`, \`mneme-graph==3.6.0\`, \`mneme-code==3.6.0\`
          - npm: \`mneme-mcp-server@3.6.0\`

          Verification used public GitHub, PyPI, and npm endpoints after the publishing workflow completed successfully.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
