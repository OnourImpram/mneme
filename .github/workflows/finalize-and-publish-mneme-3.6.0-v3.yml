name: Finalize and publish Mneme 3.6.0 v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mneme-finalize-and-publish-3-6-0-v3
  cancel-in-progress: true

jobs:
  finalize:
    name: Reconcile, verify, merge, tag, publish, and confirm
    if: github.head_ref == 'release/mneme-3.6.0-finalize-v3-20260716'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Require one-time finalization marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/finalize-and-publish-mneme-3.6.0-v3.ready ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v6
        if: steps.marker.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.marker.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm

      - name: Detect an already complete public release
        if: steps.marker.outputs.ready == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          complete=false
          if git ls-remote --exit-code --tags origin refs/tags/v3.6.0 >/dev/null 2>&1 \
            && gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch origin tag v3.6.0
            tag_sha=$(git rev-list -n 1 v3.6.0)
            git checkout --detach "$tag_sha"
            if python tools/version_bump.py --check 3.6.0 >/dev/null 2>&1; then
              if python - <<'PY'
          import json
          import urllib.request

          endpoints = [
              'https://pypi.org/pypi/mneme-core/3.6.0/json',
              'https://pypi.org/pypi/mneme-cc-plugin/3.6.0/json',
              'https://pypi.org/pypi/mneme-graph/3.6.0/json',
              'https://pypi.org/pypi/mneme-code/3.6.0/json',
              'https://registry.npmjs.org/mneme-mcp-server/3.6.0',
          ]
          for url in endpoints:
              request = urllib.request.Request(url, headers={'User-Agent': 'mneme-release-verifier/3.6.0'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200 or not json.load(response):
                      raise SystemExit(1)
          PY
              then
                complete=true
              fi
            fi
          fi
          git checkout "$GITHUB_HEAD_REF"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Record existing publication and close without repository changes
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url=$(gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          body=$(cat <<EOF
          <!-- mneme-3.6.0-release-verification -->
          ## Mneme 3.6.0 publication verified

          The release was already complete when the clean finalizer ran.

          - Annotated tag: \`v3.6.0\`
          - GitHub Release: $release_url
          - PyPI: \`mneme-core==3.6.0\`, \`mneme-cc-plugin==3.6.0\`, \`mneme-graph==3.6.0\`, \`mneme-code==3.6.0\`
          - npm: \`mneme-mcp-server@3.6.0\`
          EOF
          )
          gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body "$body" || true
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch

      - name: Reconcile the ten-loop source when absent from main
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ ! -f docs/MNEME_TEN_LOOP_ENGINEERING_REPORT.md ]]; then
            git fetch origin refs/pull/30/head:refs/remotes/origin/pr30-head
            git merge --squash --no-commit refs/remotes/origin/pr30-head
          fi

      - name: Prepare a clean 3.6.0 source tree
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/version_bump.py 3.6.0
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 3.6.0 - 2026-07-16'
          if heading not in text and '## [3.6.0]' not in text:
              section = '''## 3.6.0 - 2026-07-16

### Changed

- Generated MCP client schemas from runtime Zod contracts and added nine-tool schema parity coverage.
- Required explicit `scope: "*"` caller intent for cross-scope retrieval and strengthened fail-closed graph isolation.
- Added tree-sitter ABI compatibility checks before native parser calls.
- Added bounded state readers and public input limits against unbounded resource consumption.
- Activated Python and Node coverage gates, artifact installation smoke tests, security contracts, and release invariants in CI.
- Reconciled retrieval, privacy, benchmark, architecture, and competitive claims with reachable behavior.
- Added machine-readable capability reporting and the ten-loop engineering evidence set.

### Compatibility

- Markdown vault and derived-index formats are unchanged.
- No data migration is required.
- Intentional cross-scope reads must pass `scope: "*"` explicitly.
- Inputs above documented safety limits are rejected before processing.

'''
              first_section = text.find('\n## ')
              if first_section == -1:
                  text = text.rstrip() + '\n\n' + section
              else:
                  text = text[:first_section + 1] + section + text[first_section + 1:]
              changelog.write_text(text, encoding='utf-8')

          notes = Path('docs/releases/3.6.0.md')
          notes.parent.mkdir(parents=True, exist_ok=True)
          if not notes.exists():
              notes.write_text('''# Mneme 3.6.0

Mneme 3.6.0 is a reliability, security, privacy, retrieval-contract, and release-engineering upgrade produced through ten complete engineering loops.

Markdown remains durable ground truth. Derived indexes remain rebuildable. The Stop path remains deterministic, local, and free of LLM or external-network dependencies.

See `docs/MNEME_TEN_LOOP_ENGINEERING_REPORT.md` for the complete evidence record.
''', encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          if ci.exists():
              ci_text = ci.read_text(encoding='utf-8')
              marker = '\n  engineering-preflight:\n'
              if marker in ci_text:
                  ci.write_text(ci_text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY

          rm -f .github/finalize-and-publish-mneme-3.6.0-v3.ready
          rm -f .github/workflows/finalize-and-publish-mneme-3.6.0-v3.yml
          rm -f .github/finalize-mneme-3.6.0.ready
          rm -f .github/finalize-mneme-3.6.0-v2.ready
          rm -f .github/publish-mneme-3.6.0.ready
          rm -f .github/publish-mneme-3.6.0-v2.ready
          rm -f .github/mneme-3.6.0-orchestrate.ready
          rm -f .github/release-3.6.0.ready
          rm -f .github/post-merge-publish-3.6.0.ready
          rm -f .github/confirm-publication-3.6.0.ready
          rm -f .github/workflows/finalize-mneme-3.6.0.yml
          rm -f .github/workflows/finalize-mneme-3.6.0-v2.yml
          rm -f .github/workflows/confirm-and-publish-mneme-3.6.0.yml
          rm -f .github/workflows/confirm-and-publish-mneme-3.6.0-v2.yml
          rm -f .github/workflows/mneme-3.6.0-orchestrator.yml
          rm -f .github/workflows/prepare-release-3.6.0.yml
          rm -f .github/workflows/release-on-version-merge.yml
          rm -f .github/workflows/post-merge-publish-3.6.0.yml
          rm -f .github/workflows/confirm-publication-3.6.0.yml
          rm -f .github/engineering-bundle-diagnostic.json
          rm -f .github/ten-loop-engineering.ready
          rm -f .github/ten-loop-engineering.mbox.gz.b64
          rm -f .github/ten-loop-engineering.part-*
          rm -f .github/workflows/apply-engineering-bundle.yml

          python tools/version_bump.py --check 3.6.0
          test -f docs/MNEME_TEN_LOOP_ENGINEERING_REPORT.md
          test -f docs/MNEME_ISSUE_LEDGER.md
          test -f docs/MNEME_INVARIANT_LEDGER.md
          ! grep -q 'engineering-preflight:' .github/workflows/ci.yml

      - name: Run complete release-candidate verification
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
          make install-dev
          make test
          make lint
          pnpm -r build
          make bench-all

      - name: Commit and publish the clean candidate branch when needed
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mneme release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet origin/main --; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'release: prepare Mneme 3.6.0'
            candidate_sha=$(git rev-parse HEAD)
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Merge the verified candidate or close a net-empty finalizer
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == 'true' ]]; then
            for attempt in $(seq 1 60); do
              current_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
              [[ "$current_head" == "$CANDIDATE_SHA" ]] && break
              sleep 2
            done
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$CANDIDATE_SHA"
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
            gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --admin \
              --subject 'release: Mneme 3.6.0' \
              --body 'Verified ten-loop engineering hardening, clean release preparation, and reproducible release gates.'
            for attempt in $(seq 1 60); do
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)" == 'true' ]] && break
              sleep 2
            done
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merged)" = 'true'
            release_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .merge_commit_sha)
          else
            release_sha="$CANDIDATE_SHA"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'The clean finalizer produced no repository diff. Publication continues from the already verified main commit.'
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch || true
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify merged main and resolve immutable release tag
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: tag
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout --detach "$RELEASE_SHA"
          python tools/version_bump.py --check 3.6.0
          python tools/spec_verify.py
          python tools/repo_integrity.py
          test -f docs/MNEME_TEN_LOOP_ENGINEERING_REPORT.md

          if git ls-remote --exit-code --tags origin refs/tags/v3.6.0 >/dev/null 2>&1; then
            git fetch origin tag v3.6.0
            tag_sha=$(git rev-list -n 1 v3.6.0)
            git merge-base --is-ancestor "$tag_sha" "$RELEASE_SHA"
            git checkout --detach "$tag_sha"
            python tools/version_bump.py --check 3.6.0
          else
            tag_sha="$RELEASE_SHA"
            git config user.name 'mneme release automation'
            git config user.email 'actions@users.noreply.github.com'
            git tag -a v3.6.0 -m 'Mneme 3.6.0' "$tag_sha"
            git push origin refs/tags/v3.6.0
          fi
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Reuse, repair, or dispatch trusted publishing
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          success_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
            --json databaseId,headSha,conclusion,createdAt \
            --jq "map(select(.headSha == \"$TAG_SHA\" and .conclusion == \"success\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")
          if [[ -n "$success_id" ]]; then
            echo "run_id=$success_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
            --json databaseId,headSha,status,createdAt \
            --jq "map(select(.headSha == \"$TAG_SHA\" and .status != \"completed\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")

          if [[ -n "$active_id" ]]; then
            gh run watch "$active_id" --repo "$GITHUB_REPOSITORY" --exit-status
            echo "run_id=$active_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          failed_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
            --json databaseId,headSha,conclusion,createdAt \
            --jq "map(select(.headSha == \"$TAG_SHA\" and (.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"timed_out\"))) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")

          if [[ -n "$failed_id" ]]; then
            gh run rerun "$failed_id" --repo "$GITHUB_REPOSITORY" --failed
            gh run watch "$failed_id" --repo "$GITHUB_REPOSITORY" --exit-status
            echo "run_id=$failed_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v3.6.0 \
            -f dry_run=false -f target_version=3.6.0
          run_id=''
          for attempt in $(seq 1 90); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 \
              --json databaseId,headSha,status,createdAt \
              --jq "map(select(.headSha == \"$TAG_SHA\" and .status != \"completed\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty")
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = 'success'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Verify public GitHub, PyPI, and npm publication
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        id: public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url=''
          for attempt in $(seq 1 80); do
            release_url=$(gh release view v3.6.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url \
              --jq 'select(.tagName == "v3.6.0" and .isDraft == false and .isPrerelease == false) | .url' 2>/dev/null || true)
            [[ -n "$release_url" ]] && break
            sleep 15
          done
          test -n "$release_url"

          python - <<'PY'
          import json
          import time
          import urllib.request

          endpoints = {
              'mneme-core': 'https://pypi.org/pypi/mneme-core/3.6.0/json',
              'mneme-cc-plugin': 'https://pypi.org/pypi/mneme-cc-plugin/3.6.0/json',
              'mneme-graph': 'https://pypi.org/pypi/mneme-graph/3.6.0/json',
              'mneme-code': 'https://pypi.org/pypi/mneme-code/3.6.0/json',
              'mneme-mcp-server': 'https://registry.npmjs.org/mneme-mcp-server/3.6.0',
          }
          pending = dict(endpoints)
          for _ in range(80):
              for name, url in list(pending.items()):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'mneme-release-verifier/3.6.0'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status == 200 and json.load(response):
                              del pending[name]
                  except Exception:
                      pass
              if not pending:
                  break
              time.sleep(15)
          if pending:
              raise SystemExit('Registry versions not observable: ' + ', '.join(sorted(pending)))
          PY
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Record publication evidence and retire superseded pull requests
        if: steps.marker.outputs.ready == 'true' && steps.existing.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
          RUN_ID: ${{ steps.publishing.outputs.run_id }}
          RELEASE_URL: ${{ steps.public.outputs.release_url }}
        run: |
          set -euo pipefail
          marker='<!-- mneme-3.6.0-release-verification -->'
          body=$(cat <<EOF
          $marker
          ## Mneme 3.6.0 publication verified

          - Annotated tag: \`v3.6.0\`
          - Tagged commit: \`$TAG_SHA\`
          - GitHub Release: $RELEASE_URL
          - Trusted publishing workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - PyPI: \`mneme-core==3.6.0\`, \`mneme-cc-plugin==3.6.0\`, \`mneme-graph==3.6.0\`, \`mneme-code==3.6.0\`
          - npm: \`mneme-mcp-server@3.6.0\`

          Verification used public GitHub, PyPI, and npm endpoints after trusted publishing completed successfully.
          EOF
          )
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/30/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh pr comment 30 --repo "$GITHUB_REPOSITORY" --body "$body" || true
          fi

          state30=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .state 2>/dev/null || echo closed)
          merged30=$(gh api "repos/$GITHUB_REPOSITORY/pulls/30" --jq .merged 2>/dev/null || echo false)
          if [[ "$state30" == 'open' && "$merged30" != 'true' ]]; then
            gh pr close 30 --repo "$GITHUB_REPOSITORY" --comment 'Superseded by the verified Mneme 3.6.0 release finalizer. The complete engineering source and publication evidence are preserved.'
          fi

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/mneme-3.6.0-finalize-v3-20260716" >/dev/null 2>&1 || true
