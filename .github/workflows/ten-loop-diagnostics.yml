name: Ten-loop diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ten-loop-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Capture focused diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ten-loop-diagnostics
          python -m pip install -e 'packages/mneme-core[dev]' > ten-loop-diagnostics/python-install.log 2>&1
          python_install=$?
          ruff check packages/mneme-core --output-format=full > ten-loop-diagnostics/ruff.log 2>&1
          ruff_exit=$?
          pnpm install --frozen-lockfile > ten-loop-diagnostics/pnpm-install.log 2>&1
          pnpm_install=$?
          pnpm --filter mneme-mcp-server test -- --reporter=verbose > ten-loop-diagnostics/node-test.log 2>&1
          node_test=$?
          printf 'python_install=%s\nruff=%s\npnpm_install=%s\nnode_test=%s\n' "$python_install" "$ruff_exit" "$pnpm_install" "$node_test" | tee ten-loop-diagnostics/results.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-loop-diagnostics-${{ github.sha }}
          path: ten-loop-diagnostics/**
          if-no-files-found: error
          retention-days: 1
