name: Ten-loop diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ten-loop-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Capture focused diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ten-loop-diagnostics/packages ten-loop-diagnostics/coverage
          python -m pip install -e 'packages/mneme-core[dev]' > ten-loop-diagnostics/python-install.log 2>&1
          python_install=$?
          ruff check packages/mneme-core packages/mneme-cc-plugin --output-format=full > ten-loop-diagnostics/ruff.log 2>&1
          ruff_exit=$?
          pnpm install --frozen-lockfile > ten-loop-diagnostics/pnpm-install.log 2>&1
          pnpm_install=$?
          pnpm --filter mneme-mcp-server build > ten-loop-diagnostics/node-build.log 2>&1
          node_build=$?
          pnpm --filter mneme-mcp-server test -- --reporter=verbose > ten-loop-diagnostics/node-test.log 2>&1
          node_test=$?
          pnpm --filter mneme-mcp-server exec vitest run --coverage --reporter=verbose > ten-loop-diagnostics/node-coverage.log 2>&1
          node_coverage=$?
          test -d packages/mneme-mcp/coverage && cp -R packages/mneme-mcp/coverage/. ten-loop-diagnostics/coverage/
          python -m pip install build > ten-loop-diagnostics/build-tool-install.log 2>&1
          build_tool=$?
          for package in mneme-core mneme-cc-plugin mneme-graph mneme-code; do
            python -m build --outdir "$(pwd)/ten-loop-diagnostics/packages" "packages/$package" > "ten-loop-diagnostics/build-$package.log" 2>&1
            printf '%s=%s\n' "$package" "$?" >> ten-loop-diagnostics/python-build-results.txt
          done
          pnpm --filter mneme-mcp-server pack --pack-destination "$(pwd)/ten-loop-diagnostics/packages" > ten-loop-diagnostics/npm-pack.log 2>&1
          npm_pack=$?
          printf 'python_install=%s\nruff=%s\npnpm_install=%s\nnode_build=%s\nnode_test=%s\nnode_coverage=%s\nbuild_tool=%s\nnpm_pack=%s\n' "$python_install" "$ruff_exit" "$pnpm_install" "$node_build" "$node_test" "$node_coverage" "$build_tool" "$npm_pack" | tee ten-loop-diagnostics/results.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-loop-diagnostics-${{ github.sha }}
          path: ten-loop-diagnostics/**
          if-no-files-found: error
          retention-days: 1
