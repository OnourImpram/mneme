name: Release prepared version after merge

on:
  push:
    branches: [main]
    paths:
      - 'packages/mneme-core/pyproject.toml'
      - 'packages/mneme-mcp/package.json'
      - 'packages/mneme-cc-plugin/pyproject.toml'
      - 'packages/mneme-graph/pyproject.toml'
      - 'packages/mneme-code/pyproject.toml'
      - 'CITATION.cff'
      - 'server.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: mneme-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    name: Tag and dispatch verified release
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve and verify prepared version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('packages/mneme-core/pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )
          python tools/version_bump.py --check "$version"
          python tools/spec_verify.py
          python tools/repo_integrity.py
          python tools/validate_codex_plugin.py packages/mneme-codex-plugin
          python tools/validate_antigravity_plugin.py packages/mneme-antigravity-plugin
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Refuse duplicate or non-release tags
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "Invalid release tag: $TAG" >&2; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
      - name: Create annotated release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "mneme release automation"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$TAG" -m "Mneme $VERSION"
          git push origin "refs/tags/$TAG"
      - name: Dispatch trusted publishing workflow at the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f dry_run=false \
            -f target_version="$VERSION"
