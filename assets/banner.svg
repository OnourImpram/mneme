<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="mneme — vault-native memory for Claude Code">
  <title>mneme</title>
  <desc>A night-sky banner: the wordmark "mneme" in gold serif beside a constellation that doubles as a knowledge graph, evoking Mnemosyne, muse of memory.</desc>
  <defs>
    <radialGradient id="sky" cx="30%" cy="32%" r="98%">
      <stop offset="0%" stop-color="#1b2750"/>
      <stop offset="46%" stop-color="#0e1733"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe7be"/>
      <stop offset="46%" stop-color="#edca86"/>
      <stop offset="100%" stop-color="#cda155"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6ae" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe6ae" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#sky)"/>

  <!-- faint star field -->
  <g fill="#cdd7ff">
    <circle cx="70" cy="48" r="1" opacity="0.30"/>
    <circle cx="210" cy="300" r="1.2" opacity="0.30"/>
    <circle cx="330" cy="62" r="0.9" opacity="0.25"/>
    <circle cx="470" cy="300" r="1.1" opacity="0.30"/>
    <circle cx="600" cy="70" r="1" opacity="0.28"/>
    <circle cx="660" cy="318" r="1.3" opacity="0.30"/>
    <circle cx="720" cy="150" r="1" opacity="0.30"/>
    <circle cx="752" cy="262" r="1.2" opacity="0.28"/>
    <circle cx="690" cy="40" r="0.9" opacity="0.25"/>
    <circle cx="820" cy="320" r="1.1" opacity="0.30"/>
    <circle cx="900" cy="46" r="1.2" opacity="0.32"/>
    <circle cx="1010" cy="330" r="1" opacity="0.28"/>
    <circle cx="1180" cy="300" r="1.3" opacity="0.30"/>
    <circle cx="1230" cy="120" r="1" opacity="0.28"/>
    <circle cx="1150" cy="330" r="0.9" opacity="0.24"/>
    <circle cx="50" cy="200" r="1.1" opacity="0.26"/>
    <circle cx="40" cy="330" r="1" opacity="0.24"/>
    <circle cx="260" cy="180" r="0.8" opacity="0.22"/>
    <circle cx="1245" cy="220" r="1.1" opacity="0.28"/>
    <circle cx="1090" cy="28" r="0.9" opacity="0.24"/>
  </g>

  <!-- constellation = knowledge graph (edges) -->
  <g stroke="#7e8ac2" stroke-width="1" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M992 168 L864 92"/>
    <path d="M992 168 L812 178"/>
    <path d="M992 168 L1096 108"/>
    <path d="M992 168 L890 252"/>
    <path d="M864 92 L812 178"/>
    <path d="M1096 108 L1158 198"/>
    <path d="M1158 198 L1052 268"/>
    <path d="M1052 268 L890 252"/>
    <path d="M1096 108 L1126 56"/>
    <path d="M992 168 L1158 198"/>
    <path d="M890 252 L948 312"/>
  </g>

  <!-- constellation nodes -->
  <circle cx="992" cy="168" r="27" fill="url(#hubGlow)"/>
  <circle cx="992" cy="168" r="6.5" fill="url(#gold)"/>
  <circle cx="864" cy="92" r="4" fill="#edca86"/>
  <circle cx="812" cy="178" r="3.4" fill="#9fb4e8"/>
  <circle cx="1096" cy="108" r="4.2" fill="#edca86"/>
  <circle cx="1158" cy="198" r="3.6" fill="#edca86"/>
  <circle cx="1052" cy="268" r="4" fill="#9fb4e8"/>
  <circle cx="890" cy="252" r="3.6" fill="#edca86"/>
  <circle cx="1126" cy="56" r="2.6" fill="#9fb4e8"/>
  <circle cx="948" cy="312" r="2.6" fill="#edca86"/>

  <!-- wordmark: soft glow under, crisp on top -->
  <text x="118" y="196" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="140" font-weight="600" letter-spacing="1" fill="#edca86" opacity="0.45" filter="url(#glow)">mneme</text>
  <text x="118" y="196" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="140" font-weight="600" letter-spacing="1" fill="url(#gold)">mneme</text>

  <!-- classical rule + star accent -->
  <line x1="124" y1="232" x2="566" y2="232" stroke="#caa463" stroke-width="1.2" opacity="0.6"/>
  <path d="M586 232 l6 -7 l6 7 l-6 7 z" fill="#edca86" opacity="0.85"/>

  <!-- tagline -->
  <text x="126" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" letter-spacing="5" fill="#bcc6e6">VAULT-NATIVE MEMORY FOR CLAUDE CODE</text>

  <!-- sub-tagline -->
  <text x="126" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="1.4" fill="#737fa8">markdown is ground truth · hybrid retrieval · zero-LLM Stop · temporal</text>
</svg>
